name: deploy

# Pushes to main are verified (the same `pnpm verify` the PR workflow runs) and, if that passes,
# published to GitHub Pages. Pages must be set to deploy from GitHub Actions
# (Settings → Pages → Source).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time. A newer push waits for the running one instead of cancelling it, so
# a deployment is never cut off halfway. Only one push waits: a newer one replaces it, so after a
# quick series of pushes only the latest commit is published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages reads the Pages settings for the base path.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # base_path is "/<repo>" for a project site and "" for a custom domain.
      - run: pnpm verify
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
