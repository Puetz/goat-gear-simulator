<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The layout needs 1024 px, so phones show it zoomed out instead of cutting it off. -->
    <meta name="viewport" content="width=1024" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#2a1d4e" />
    <title>GOAT Gear Simulator</title>
    <meta
      name="description"
      content="Gear stat simulator for GOAT - Gear Optimization Auto-Battle Tactics. Pick up to eight items and see the stats, tags and chromatic bonus they give. Unofficial fan project."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews. Their image needs a full URL, so it points at the published site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GOAT Gear Simulator" />
    <meta property="og:title" content="GOAT Gear Simulator" />
    <meta
      property="og:description"
      content="Pick up to eight items and see the stats, tags and chromatic bonus they give. Unofficial fan project."
    />
    <meta property="og:url" content="https://puetz.github.io/goat-gear-simulator/" />
    <meta property="og:image" content="https://puetz.github.io/goat-gear-simulator/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The simulator with eight items equipped, their tags and the resulting stats"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
